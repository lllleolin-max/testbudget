[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "testbudget"
version = "0.2.0"
description = "Auditable revision-aware CI execution-budget selection"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "lllleolin-max"}]
dependencies = []

[project.scripts]
testbudget = "testbudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
